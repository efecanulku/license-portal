# Local geliştirmede değerleri env'den alır (bkz: env.example)
spring.application.name=license-portal

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/license_portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Flyway Gün 2'de migration'lar eklenecek
spring.flyway.enabled=false
