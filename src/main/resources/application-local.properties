# Sadece local ortam için ek ayarlar
spring.flyway.enabled=true

# Local'da .env dosyasından property okumayı kolaylaştırır (git'e girmez)
# Format: KEY=VALUE
# Not: user.dir bazlı absolute path, "cd" kaynaklı sorunları önler
spring.config.import=optional:file:${user.dir}/.env[.properties]

# Local geliştirmede seed (prod'u etkilemesin diye profile'a özel)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed-local.sql

# Security debug (local only) - login neden fail oluyor görmemiz için
logging.level.org.springframework.security=DEBUG
