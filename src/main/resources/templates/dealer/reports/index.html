<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Raporlar</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Raporlar', content=~{::content})}">
    <div th:fragment="content">
        <h1 class="h4 mb-3">Raporlar</h1>
        <p class="text-secondary small mb-4">Kendi lisanslarınıza ait özet raporlar.</p>
        <div class="list-group">
            <a class="list-group-item list-group-item-action" th:href="@{/dealer/reports/dealer-count}">
                <div class="fw-semibold">Lisans özetim</div>
                <div class="small text-secondary">Ürettiğiniz lisans sayısı</div>
            </a>
            <a class="list-group-item list-group-item-action" th:href="@{/dealer/reports/expiring}">
                <div class="fw-semibold">Süresi dolan / yaklaşan lisanslar</div>
                <div class="small text-secondary">Bitiş tarihine göre filtrelenmiş liste</div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
