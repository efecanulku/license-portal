<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Lisans Üret</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Lisans Üret', content=~{::content})}">
    <div th:fragment="content">
        <h1 class="h4 mb-3">Lisans Üret</h1>
        <p class="text-secondary small mb-3">Yalnızca yetkili ürünleriniz ve kendi kurumlarınız listelenir.</p>
        <div class="card">
            <div class="card-body">
                <form th:action="@{/dealer/licenses/new}" method="post" th:object="${form}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div th:replace="~{licenses/_generate-form :: licenseGenerateForm(submitLabel='Doğrula')}"></div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
