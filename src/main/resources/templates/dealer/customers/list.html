<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Kurumlarım</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Kurumlarım', content=~{::content})}">
    <div th:fragment="content">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h1 class="h4 mb-0">Kurumlarım</h1>
                <div class="text-secondary small">Bayinize bağlı kurumlar</div>
            </div>
            <a class="btn btn-primary" th:href="@{/dealer/customers/new}">Yeni kurum</a>
        </div>

        <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
        <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>

        <div th:replace="~{common/_list-search :: listSearch(formAction='/dealer/customers', pageParams=${pageParams}, dealerId=null)}"></div>

        <p class="text-secondary small mb-2" th:if="${itemPage != null}"
           th:text="|${itemPage.totalElements} kayıt|"></p>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Kurum</th>
                        <th>Vergi no</th>
                        <th>Yetkili</th>
                        <th>Oluşturma</th>
                        <th class="text-end">İşlem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${customers}">
                        <td class="fw-semibold" th:text="${c.name}"></td>
                        <td th:text="${c.taxNumber}"></td>
                        <td th:text="${c.contactName}"></td>
                        <td th:text="${c.createdAt}"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/dealer/customers/{id}/edit(id=${c.id})}">Düzenle</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="5" class="text-center text-secondary py-4">Henüz kurum yok.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div th:replace="~{common/_simple-pagination :: simplePagination(page=${itemPage}, formAction='/dealer/customers', dealerId=null, pageParams=${pageParams})}"></div>
    </div>
</div>
</body>
</html>
