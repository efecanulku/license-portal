<div xmlns:th="http://www.thymeleaf.org" th:fragment="barChart(canvasId, chartTitle)">
    <div class="card mb-4" th:if="${showChart}">
        <div class="card-body">
            <div class="small text-secondary mb-2" th:text="${chartTitle} ?: 'Dağılım grafiği'">Dağılım grafiği</div>
            <div class="portal-chart-wrap portal-chart-wrap--bar"
                 th:id="|chartWrap_${canvasId}|"
                 th:classappend="${chartLabels != null and #lists.size(chartLabels) <= 4} ? ' portal-chart-wrap--bar-compact' : ''">
                <canvas th:id="${canvasId}" th:attr="aria-label=${chartTitle}"></canvas>
            </div>
        </div>
    </div>
    <script th:if="${showChart}" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <script th:if="${showChart}" th:inline="javascript">
        (function () {
            const labels = /*[[${chartLabels}]]*/ [];
            const values = /*[[${chartValues}]]*/ [];
            const canvasId = /*[[${canvasId}]]*/ 'reportBarChart';
            const ctx = document.getElementById(canvasId);
            if (!ctx || typeof Chart === 'undefined' || !labels.length) return;

            const count = labels.length;
            const compact = count <= 4;

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Lisans sayısı',
                        data: values,
                        backgroundColor: '#5b7cfa',
                        borderRadius: 6,
                        maxBarThickness: compact ? 52 : 40,
                        barPercentage: compact ? 0.55 : 0.75,
                        categoryPercentage: compact ? 0.65 : 0.8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {legend: {display: false}},
                    scales: {
                        x: {
                            grid: {display: false},
                            ticks: {
                                maxRotation: 45,
                                minRotation: 0,
                                autoSkip: count > 8
                            }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {precision: 0},
                            grid: {color: 'rgba(148, 163, 184, 0.2)'}
                        }
                    }
                }
            });
        })();
    </script>
</div>
