<nav xmlns:th="http://www.thymeleaf.org" th:fragment="reportPagination(page, filter, formAction)"
     th:if="${page.totalPages > 1}" class="mt-3" aria-label="Sayfalama">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{${formAction}(status=${filter.status}, withinDays=${filter.withinDays}, page=${page.number - 1})}">Önceki</a>
        </li>
        <li class="page-item disabled">
            <span class="page-link"
                  th:text="|Sayfa ${page.number + 1} / ${page.totalPages} (${page.totalElements} kayıt)|"></span>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{${formAction}(status=${filter.status}, withinDays=${filter.withinDays}, page=${page.number + 1})}">Sonraki</a>
        </li>
    </ul>
</nav>
