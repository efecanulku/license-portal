<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Şifre değiştir</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Şifre değiştir', content=~{::content})}">
    <div th:fragment="content">
        <h1 class="h4 mb-3">Şifre değiştir</h1>
        <p class="text-secondary small mb-3">Hesabınız için yeni bir şifre belirleyin.</p>
        <div class="card">
            <div class="card-body">
                <form th:action="@{/account/password}" method="post" th:object="${form}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label" for="currentPassword">Mevcut şifre</label>
                        <input id="currentPassword" type="password" class="form-control"
                               th:field="*{currentPassword}" autocomplete="current-password"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}"
                             th:errors="*{currentPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">Yeni şifre</label>
                        <input id="newPassword" type="password" class="form-control"
                               th:field="*{newPassword}" autocomplete="new-password"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}"
                             th:errors="*{newPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Yeni şifre (tekrar)</label>
                        <input id="confirmPassword" type="password" class="form-control"
                               th:field="*{confirmPassword}" autocomplete="new-password"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">Güncelle</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
