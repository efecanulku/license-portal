<nav xmlns:th="http://www.thymeleaf.org"
     th:fragment="licensePagination(page, filter, formAction, showDealerFilter)"
     th:if="${page.totalPages > 1}" class="mt-3" aria-label="Sayfalama">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:if="${showDealerFilter}"
               th:href="@{${formAction}(dealerId=${filter.dealerId}, productId=${filter.productId}, customerId=${filter.customerId}, validUntilFrom=${filter.validUntilFrom}, validUntilTo=${filter.validUntilTo}, page=${page.number - 1})}">Önceki</a>
            <a class="page-link" th:unless="${showDealerFilter}"
               th:href="@{${formAction}(productId=${filter.productId}, customerId=${filter.customerId}, validUntilFrom=${filter.validUntilFrom}, validUntilTo=${filter.validUntilTo}, page=${page.number - 1})}">Önceki</a>
        </li>
        <li class="page-item disabled">
            <span class="page-link"
                  th:text="|Sayfa ${page.number + 1} / ${page.totalPages} (${page.totalElements} kayıt)|"></span>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:if="${showDealerFilter}"
               th:href="@{${formAction}(dealerId=${filter.dealerId}, productId=${filter.productId}, customerId=${filter.customerId}, validUntilFrom=${filter.validUntilFrom}, validUntilTo=${filter.validUntilTo}, page=${page.number + 1})}">Sonraki</a>
            <a class="page-link" th:unless="${showDealerFilter}"
               th:href="@{${formAction}(productId=${filter.productId}, customerId=${filter.customerId}, validUntilFrom=${filter.validUntilFrom}, validUntilTo=${filter.validUntilTo}, page=${page.number + 1})}">Sonraki</a>
        </li>
    </ul>
</nav>
