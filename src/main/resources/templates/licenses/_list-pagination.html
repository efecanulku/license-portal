<nav xmlns:th="http://www.thymeleaf.org"
     th:fragment="licensePagination(page, filter, formAction, showDealerFilter)"
     th:if="${page.totalPages > 1}" class="mt-3" aria-label="Sayfalama">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link"
               th:href="|${formAction}?page=${page.number - 1}${showDealerFilter and filter.dealerId != null ? '&dealerId=' + filter.dealerId : ''}${filter.productId != null ? '&productId=' + filter.productId : ''}${filter.customerId != null ? '&customerId=' + filter.customerId : ''}${filter.validUntilFrom != null ? '&validUntilFrom=' + filter.validUntilFrom : ''}${filter.validUntilTo != null ? '&validUntilTo=' + filter.validUntilTo : ''}${filter.q != null and !#strings.isEmpty(filter.q) ? '&q=' + filter.q : ''}|">Önceki</a>
        </li>
        <li class="page-item disabled">
            <span class="page-link"
                  th:text="|Sayfa ${page.number + 1} / ${page.totalPages} (${page.totalElements} kayıt)|"></span>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link"
               th:href="|${formAction}?page=${page.number + 1}${showDealerFilter and filter.dealerId != null ? '&dealerId=' + filter.dealerId : ''}${filter.productId != null ? '&productId=' + filter.productId : ''}${filter.customerId != null ? '&customerId=' + filter.customerId : ''}${filter.validUntilFrom != null ? '&validUntilFrom=' + filter.validUntilFrom : ''}${filter.validUntilTo != null ? '&validUntilTo=' + filter.validUntilTo : ''}${filter.q != null and !#strings.isEmpty(filter.q) ? '&q=' + filter.q : ''}|">Sonraki</a>
        </li>
    </ul>
</nav>
