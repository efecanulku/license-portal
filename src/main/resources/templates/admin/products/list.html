<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{common/layout :: layout(content=~{::content}, pageTitle='Ürünler')}">
    <th:block th:fragment="content">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 mb-0">Ürünler</h1>
            <a class="btn btn-primary btn-sm" th:href="@{/admin/products/new}">Yeni ürün</a>
        </div>

        <div class="bg-white border rounded-3 overflow-hidden">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Ad</th>
                    <th>Kod</th>
                    <th>Aktif</th>
                    <th>Oluşturma</th>
                    <th class="text-end">İşlem</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="5" class="text-secondary">Henüz ürün yok.</td>
                </tr>
                <tr th:each="p : ${products}">
                    <td th:text="${p.name}"></td>
                    <td><code th:text="${p.code}"></code></td>
                    <td th:text="${p.active} ? 'Evet' : 'Hayır'"></td>
                    <td th:text="${p.createdAt}"></td>
                    <td class="text-end">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{|/admin/products/${p.id}/edit|}">Düzenle</a>
                        <form th:action="@{|/admin/products/${p.id}/toggle-active|}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-outline-warning btn-sm" type="submit"
                                    th:text="${p.active} ? 'Pasifleştir' : 'Aktifleştir'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</th:block>
</html>
