<div xmlns:th="http://www.thymeleaf.org" th:fragment="dealerForm(form, submitLabel)" th:object="${form}">
    <div class="mb-3">
        <label class="form-label" for="name">Firma adı</label>
        <input id="name" class="form-control" th:field="*{name}" placeholder="Örn: Demo Bayi Ltd."/>
        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="contactName">Yetkili kişi</label>
        <input id="contactName" class="form-control" th:field="*{contactName}" placeholder="Opsiyonel"/>
        <div class="text-danger small" th:if="${#fields.hasErrors('contactName')}" th:errors="*{contactName}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="email">E-posta</label>
        <input id="email" type="email" class="form-control" th:field="*{email}" placeholder="Opsiyonel"/>
        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="phone">Telefon</label>
        <input id="phone" class="form-control" th:field="*{phone}" placeholder="Opsiyonel"/>
        <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>

    <div class="form-check mb-3">
        <input id="active" class="form-check-input" type="checkbox" th:field="*{active}"/>
        <label class="form-check-label" for="active">Aktif</label>
    </div>

    <button class="btn btn-primary" type="submit" th:text="${submitLabel}"></button>
    <a class="btn btn-outline-secondary ms-2" th:href="@{/admin/dealers}">İptal</a>
</div>
