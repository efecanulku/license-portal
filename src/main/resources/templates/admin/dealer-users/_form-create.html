<div xmlns:th="http://www.thymeleaf.org" th:fragment="dealerUserCreateForm(submitLabel)" th:object="${form}">
    <div class="mb-3">
        <label class="form-label" for="username">Kullanıcı adı</label>
        <input id="username" class="form-control" th:field="*{username}" placeholder="Örn: bayi1"/>
        <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="password">Şifre</label>
        <input id="password" type="password" class="form-control" th:field="*{password}" placeholder="En az 8 karakter"/>
        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="fullName">Ad soyad</label>
        <input id="fullName" class="form-control" th:field="*{fullName}" placeholder="Opsiyonel"/>
        <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="email">E-posta</label>
        <input id="email" type="email" class="form-control" th:field="*{email}" placeholder="Opsiyonel"/>
        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <div class="form-check mb-3">
        <input id="active" class="form-check-input" type="checkbox" th:field="*{active}"/>
        <label class="form-check-label" for="active">Aktif</label>
    </div>

    <button class="btn btn-primary" type="submit" th:text="${submitLabel}"></button>
    <a class="btn btn-outline-secondary ms-2" th:href="@{/admin/dealers/{id}/users(id=${dealerId})}">İptal</a>
</div>
