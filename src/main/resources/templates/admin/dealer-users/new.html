<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Yeni Bayi Kullanıcısı</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Yeni Bayi Kullanıcısı', content=~{::content})}">
    <div th:fragment="content">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h1 class="h4 mb-0">Yeni Kullanıcı</h1>
                <div class="text-secondary small" th:text="|Bayi: ${dealer.name}|"></div>
            </div>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/dealers/{id}/users(id=${dealerId})}">Listeye dön</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/dealers/{id}/users(id=${dealerId})}" method="post" th:object="${form}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div th:replace="~{admin/dealer-users/_form-create :: dealerUserCreateForm(submitLabel='Oluştur')}"></div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
