<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Bayi Kullanıcıları</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Bayi Kullanıcıları', content=~{::content})}">
    <div th:fragment="content">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h1 class="h4 mb-0" th:text="|${dealer.name} — Kullanıcılar|">Bayi Kullanıcıları</h1>
                <div class="text-secondary small">BAYI rolü kullanıcıları</div>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/admin/dealers}">Bayilere dön</a>
                <a class="btn btn-primary" th:href="@{/admin/dealers/{id}/users/new(id=${dealerId})}">Yeni kullanıcı</a>
            </div>
        </div>

        <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
        <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>

        <form class="card card-body mb-3" method="get" th:action="${listFormAction}">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label" for="listSearchQ">Ara</label>
                    <input id="listSearchQ" type="search" name="q" class="form-control"
                           th:value="${pageParams != null ? pageParams.q : ''}"
                           placeholder="Kullanıcı adı, ad soyad veya e-posta"/>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-primary" type="submit">Ara</button>
                    <a class="btn btn-link btn-sm"
                       th:if="${pageParams != null and !#strings.isEmpty(pageParams.q)}"
                       th:href="${listFormAction}">Temizle</a>
                </div>
            </div>
        </form>

        <p class="text-secondary small mb-2" th:if="${itemPage != null}"
           th:text="|${itemPage.totalElements} kayıt|"></p>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Kullanıcı adı</th>
                        <th>Ad soyad</th>
                        <th>E-posta</th>
                        <th>Durum</th>
                        <th class="text-end">İşlem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}"></td>
                        <td class="fw-semibold" th:text="${u.username}"></td>
                        <td th:text="${u.fullName}"></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span th:if="${u.active}" class="badge text-bg-success">Aktif</span>
                            <span th:if="${!u.active}" class="badge text-bg-secondary">Pasif</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/admin/dealers/{dealerId}/users/{userId}/edit(dealerId=${dealerId}, userId=${u.id})}">
                                Düzenle
                            </a>
                            <form th:action="@{/admin/dealers/{dealerId}/users/{userId}/toggle-active(dealerId=${dealerId}, userId=${u.id})}"
                                  method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-sm btn-outline-warning" type="submit"
                                        th:text="${u.active} ? 'Pasifleştir' : 'Aktifleştir'"></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="text-center text-secondary py-4">Bu bayiye ait kullanıcı yok.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div th:replace="~{common/_simple-pagination :: simplePagination(page=${itemPage}, formAction=${listFormAction}, dealerId=null, pageParams=${pageParams})}"></div>
    </div>
</div>
</body>
</html>
