<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Bayi Ürün Yetkileri</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Bayi Ürün Yetkileri', content=~{::content})}">
    <div th:fragment="content">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h1 class="h4 mb-0" th:text="|${dealer.name} — Ürün Yetkileri|">Bayi Ürün Yetkileri</h1>
                <div class="text-secondary small">Yetkili ürünleri yönet</div>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/admin/dealers}">Bayilere dön</a>
        </div>


        <div class="card mb-4">
            <div class="card-header">Yetki ver</div>
            <div class="card-body">
                <form th:action="@{/admin/dealers/{id}/product-permissions/grant(id=${dealerId})}" method="post"
                      class="row g-2 align-items-end">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="col-md-8">
                        <label class="form-label" for="productId">Ürün</label>
                        <select id="productId" name="productId" class="form-select" required
                                th:disabled="${#lists.isEmpty(grantableProducts)}">
                            <option value="" disabled selected th:if="${#lists.isEmpty(grantableProducts)}">
                                Atanabilir aktif ürün yok
                            </option>
                            <option value="" disabled selected th:if="${!#lists.isEmpty(grantableProducts)}">
                                Ürün seçin
                            </option>
                            <option th:each="p : ${grantableProducts}" th:value="${p.id}"
                                    th:text="|${p.name} (${p.code})|"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" type="submit"
                                th:disabled="${#lists.isEmpty(grantableProducts)}">
                            Yetki ver
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Mevcut yetkiler</div>
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Ürün</th>
                        <th>Kod</th>
                        <th>Verilme</th>
                        <th>Veren</th>
                        <th class="text-end">İşlem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="perm : ${permissions}">
                        <td class="fw-semibold" th:text="${perm.product.name}"></td>
                        <td><code th:text="${perm.product.code}"></code></td>
                        <td th:text="${perm.grantedAt}"></td>
                        <td th:text="${perm.grantedBy != null ? perm.grantedBy.username : '—'}"></td>
                        <td class="text-end">
                            <form th:action="@{/admin/dealers/{dealerId}/product-permissions/revoke(dealerId=${dealerId})}"
                                  method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="productId" th:value="${perm.product.id}"/>
                                <button class="btn btn-sm btn-outline-danger" type="submit"
                                        onclick="return confirm('Bu ürün yetkisini kaldırmak istediğinize emin misiniz?');">
                                    Kaldır
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(permissions)}">
                        <td colspan="5" class="text-center text-secondary py-4">Henüz ürün yetkisi yok.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
