<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Lisanslar</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Lisanslar', content=~{::content})}">
    <div th:fragment="content">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h1 class="h4 mb-0">Lisanslar</h1>
                <div class="text-secondary small">Tüm lisanslar (filtreler)</div>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/licenses/new}">Lisans üret</a>
        </div>

        <div th:replace="~{licenses/_list-filters :: licenseFilters(formAction='/admin/licenses', showDealerFilter=true)}"></div>
        <p class="text-secondary small mb-2" th:if="${licensePage != null}"
           th:text="|${licensePage.totalElements} kayıt|"></p>
        <div th:replace="~{licenses/_list-table :: licenseTable(licenses=${licenses}, showDealerColumn=true, adminDetailLinks=true)}"></div>
        <div th:replace="~{licenses/_list-pagination :: licensePagination(page=${licensePage}, filter=${filter}, formAction='/admin/licenses', showDealerFilter=true)}"></div>
    </div>
</div>
</body>
</html>
