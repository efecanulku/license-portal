<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Kurumlar</title>
</head>
<body>
<div th:replace="~{common/layout :: layout(pageTitle='Kurumlar', content=~{::content})}">
    <div th:fragment="content">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h1 class="h4 mb-0">Kurumlar</h1>
                <div class="text-secondary small">Tüm kurumlar (bayi filtresi)</div>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/customers/new}">Yeni kurum</a>
        </div>

        <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
        <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>

        <form class="card card-body mb-3" method="get" th:action="@{/admin/customers}">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label" for="dealerId">Bayi filtresi</label>
                    <select id="dealerId" name="dealerId" class="form-select">
                        <option value="" th:selected="${selectedDealerId == null}">Tümü</option>
                        <option th:each="d : ${dealers}" th:value="${d.id}" th:text="${d.name}"
                                th:selected="${selectedDealerId != null and selectedDealerId == d.id}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-primary" type="submit">Filtrele</button>
                </div>
            </div>
        </form>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Kurum</th>
                        <th>Vergi no</th>
                        <th>Oluşturan bayi</th>
                        <th>Oluşturma</th>
                        <th class="text-end">İşlem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${customers}">
                        <td class="fw-semibold" th:text="${c.name}"></td>
                        <td th:text="${c.taxNumber}"></td>
                        <td th:text="${c.createdByDealer != null ? c.createdByDealer.name : '—'}"></td>
                        <td th:text="${c.createdAt}"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/admin/customers/{id}/edit(id=${c.id})}">Düzenle</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="5" class="text-center text-secondary py-4">Kayıt yok.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
