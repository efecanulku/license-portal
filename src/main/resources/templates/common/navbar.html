<nav class="navbar navbar-expand-lg portal-navbar" xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="https://www.thymeleaf.org/extras/spring-security" th:fragment="navbar">
    <div class="container-fluid">
        <button class="btn btn-outline-secondary btn-sm portal-sidebar-toggle me-2" type="button"
                id="portalSidebarToggle" aria-label="Menü">
            <i class="bi bi-list"></i>
        </button>
        <a class="navbar-brand" th:href="@{/}">
            <img class="portal-brand-logo" th:src="@{/images/avkar-logo.png}" alt="AVKAR" width="40" height="40"/>
            <span>
                AVKAR
                <span class="portal-brand-sub">Lisans Portalı</span>
            </span>
        </a>

        <div class="d-flex align-items-center gap-2 ms-auto">
            <span class="portal-user-pill d-none d-sm-inline" sec:authorize="isAuthenticated()">
                <i class="bi bi-person-circle me-1"></i>
                <span sec:authentication="name"></span>
            </span>
            <a class="btn btn-outline-secondary btn-sm" sec:authorize="isAuthenticated()"
               th:href="@{/account/password}">
                <i class="bi bi-key d-sm-none"></i>
                <span class="d-none d-sm-inline">Şifre</span>
            </a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="mb-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-primary btn-sm" type="submit">
                    <i class="bi bi-box-arrow-right me-1"></i>Çıkış
                </button>
            </form>
        </div>
    </div>
</nav>
