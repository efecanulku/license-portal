<nav class="navbar navbar-expand-lg bg-white border-bottom" xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="https://www.thymeleaf.org/extras/spring-security" th:fragment="navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" th:href="@{/}">License Portal</a>

        <div class="d-flex align-items-center gap-2">
            <span class="text-secondary small" sec:authorize="isAuthenticated()">

            </form>
        </div>
