<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
     th:fragment="sidebar">
    <div class="mb-3">
        <div class="small text-secondary">Rol</div>
        <div class="fw-semibold" sec:authorize="hasRole('ADMIN')">ADMIN</div>
        <div class="fw-semibold" sec:authorize="hasRole('BAYI')">BAYI</div>
    </div>

    <div class="list-group">
        <a sec:authorize="hasRole('ADMIN')" class="list-group-item list-group-item-action" th:href="@{/}">Ana sayfa</a>
        <a sec:authorize="hasRole('BAYI')" class="list-group-item list-group-item-action" th:href="@{/dealer/dashboard}">Bayi paneli</a>

        <div class="mt-3 small text-secondary" sec:authorize="hasRole('ADMIN')">Yönetim</div>
        <a sec:authorize="hasRole('ADMIN')" class="list-group-item list-group-item-action" th:href="@{/admin/products}">
            Ürünler
        </a>
        <a sec:authorize="hasRole('ADMIN')" class="list-group-item list-group-item-action" th:href="@{/admin/dealers}">
            Bayiler
        </a>
        <a sec:authorize="hasRole('ADMIN')" class="list-group-item list-group-item-action" th:href="@{/admin/customers}">
            Kurumlar
        </a>
        <a sec:authorize="hasRole('ADMIN')" class="list-group-item list-group-item-action" th:href="@{/admin/licenses}">
            Lisanslar
        </a>
        <a sec:authorize="hasRole('ADMIN')" class="list-group-item list-group-item-action" th:href="@{/admin/licenses/new}">
            Lisans üret
        </a>
        <div class="mt-3 small text-secondary" sec:authorize="hasAnyRole('ADMIN','BAYI')">Raporlar</div>
        <a sec:authorize="hasAnyRole('ADMIN','BAYI')" class="list-group-item list-group-item-action" th:href="@{/reports}">
            Raporlar
        </a>

        <div class="mt-3 small text-secondary" sec:authorize="hasRole('BAYI')">Bayi</div>
        <a sec:authorize="hasRole('BAYI')" class="list-group-item list-group-item-action" th:href="@{/dealer/customers}">
            Kurumlarım
        </a>
        <a sec:authorize="hasRole('BAYI')" class="list-group-item list-group-item-action" th:href="@{/dealer/licenses}">
            Lisanslarım
        </a>
        <a sec:authorize="hasRole('BAYI')" class="list-group-item list-group-item-action" th:href="@{/dealer/licenses/new}">
            Lisans üret
        </a>
    </div>
</div>
