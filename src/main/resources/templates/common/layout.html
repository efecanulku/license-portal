<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content, pageTitle)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title th:text="${pageTitle} ?: 'License Portal'">License Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">

<div th:replace="~{common/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <aside class="col-12 col-lg-2 border-end bg-white min-vh-100 p-3" th:replace="~{common/sidebar :: sidebar}"></aside>
        <main class="col-12 col-lg-10 p-4">
            <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
            <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>

            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

</body>
</html>
