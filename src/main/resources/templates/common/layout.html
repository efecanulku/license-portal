<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content, pageTitle)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title th:text="${pageTitle != null ? pageTitle + ' · AVKAR Lisans Portalı' : 'AVKAR Lisans Portalı'}">AVKAR Lisans Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/portal.css}" rel="stylesheet"/>
</head>
<body class="portal-body">

<div th:replace="~{common/navbar :: navbar}"></div>
<div class="portal-sidebar-backdrop" id="portalSidebarBackdrop"></div>

<div class="container-fluid portal-shell p-0">
    <div class="row g-0">
        <aside class="col-12 col-lg-2 portal-sidebar" id="portalSidebar"
               th:replace="~{common/sidebar :: sidebar}"></aside>
        <main class="col-12 col-lg-10 portal-main">
            <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
            <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/js/portal.js}"></script>
</body>
</html>
