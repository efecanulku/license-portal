<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Giriş • License Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 420px;">
    <div class="bg-white border rounded-3 p-4">
        <h1 class="h4 mb-3">Giriş</h1>

        <div class="alert alert-danger py-2" th:if="${param.error}">
            Kullanıcı adı veya şifre hatalı.
        </div>
        <div class="alert alert-success py-2" th:if="${param.logout}">
            Çıkış yapıldı.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label class="form-label" for="username">Kullanıcı adı</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Şifre</label>
                <input class="form-control" id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Giriş yap</button>
        </form>
    </div>
</main>
</body>
</html>
