<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Giriş · AVKAR Lisans Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/portal.css}" rel="stylesheet"/>
</head>
<body class="portal-body portal-login-page">
<main class="portal-login-card">
    <div class="portal-login-brand">
        <div class="portal-brand-mark">AV</div>
        <h1 class="h4 mb-1 fw-bold">AVKAR Lisans Portalı</h1>
        <p class="text-secondary small mb-0">Kurumsal lisans yönetimi</p>
    </div>

    <div class="alert alert-danger py-2" th:if="${param.error}">
        <i class="bi bi-exclamation-circle me-1"></i> Kullanıcı adı veya şifre hatalı.
    </div>
    <div class="alert alert-success py-2" th:if="${param.logout}">
        <i class="bi bi-check-circle me-1"></i> Çıkış yapıldı.
    </div>

    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
            <label class="form-label" for="username">Kullanıcı adı</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Şifre</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i> Giriş yap
        </button>
    </form>
</main>
</body>
</html>
